<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo App (CLJS)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f0f2f5;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
      margin: 0;
    }
    .todo-app {
      width: 100%;
      max-width: 580px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    h1 {
      color: #1a1a1a;
      text-align: center;
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 26px;
    }
    .todo-input {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .todo-input input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #dcdfe6;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .todo-input input[type="text"]:focus {
      border-color: #3b82f6;
    }
    button {
      padding: 12px 20px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    .todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .todo-item {
      display: flex;
      align-items: center;
      padding: 14px;
      margin-bottom: 10px;
      background-color: #f8fafc;
      border-radius: 8px;
      border: 1px solid #edf2f7;
      transition: background-color 0.2s;
    }
    .todo-item:hover {
      background-color: #f1f5f9;
    }
    .todo-checkbox {
      margin-right: 14px;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .todo-title {
      flex: 1;
      font-size: 15px;
      color: #334155;
    }
    .completed .todo-title {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .completed {
      opacity: 0.75;
      background-color: #f8fafc;
    }
    .delete-btn {
      background-color: #ef4444;
      font-size: 13px;
      padding: 6px 12px;
    }
    .delete-btn:hover {
      background-color: #dc2626;
    }
  </style>
</head>
<body>
  <div id="app">Carregando...</div>
  <script src="/js/main.js"></script>
</body>
</html>
